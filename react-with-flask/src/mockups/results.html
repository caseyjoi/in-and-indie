<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> Reccomendations </title>
    <link rel="stylesheet" href="styles/results.css">
</head>

<body>
    <header> 
        <h1> Welcome!</h1>
    </header>

    <main>
        <section>
            <h2> Your 5 top games: </h2>

            <div class="top-games">
                <div class="top-game">
                    <img class ="game-cover-thumbnail" src ="url">
                    
                    <div class="top-game-details">
                        <strong> Game Title </strong>
                        <span> [playtime] </span>
                        <span> [game tags] </span>
                    </div>
                </div>
            </div>

        </section>

        <section>
            <h2> Based on your top genres, we recommended these games: </h2>

            <div class="rec-card">
                <div class="rec-trailer-or-img">
                    <img src="url" alt ="game cotent">
                </div>

                <div class="rec-card-details">
                    <div class="rec-card-header"> 
                        <h3 class="game-title"> Game Title </h3>
                    </div> 

                    <div class="rec-tags">
                        <span class="tag"> genre </span>
                    </div>

                    <div class="rec-rating">
                        <span class="rating">IGDB Rating: [rating]</span>
                    </div>

                    <div class="community-buttons">
                        <a href="#" class="btn"> View on Steam </a>
                        <a href="#" class="btn"> Fandom </a>
                        <a href="#" class="btn"> Reddit </a>
                        <a href="#" class="btn"> Discord </a>
                    </div>

                    
                </div>
            </div>
        </section>
    </main>
</body>
